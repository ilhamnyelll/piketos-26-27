<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Admin | PILKETOS</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<nav class="navbar navbar-dark admin-nav">

<div class="container">

<span class="navbar-brand fw-bold">
🔐 PILKETOS ADMIN
</span>

<a href="hasil.html" class="btn btn-outline-light btn-sm">
Lihat Hasil Publik
</a>

</div>

</nav>

<main class="container py-5">

<section id="adminLogin" class="admin-login">

<div class="login-icon">
🔐
</div>

<h2>Administrator</h2>

<p>Masukkan password untuk membuka dashboard.</p>

<input
id="adminPassword"
type="password"
class="form-control form-control-lg mb-3"
placeholder="Password admin">

<button
onclick="adminLogin()"
class="btn btn-dark btn-lg w-100">
Masuk Dashboard
</button>

<div id="adminMsg"></div>

</section>

<section id="dashboard" class="d-none">

<div class="dashboard-header">

<div>

<span class="result-label">
DASHBOARD
</span>

<h1>Rekapitulasi Voting</h1>

</div>

<div>

<button
onclick="exportCSV()"
class="btn btn-success">
⬇ Export CSV
</button>

<button
onclick="resetData()"
class="btn btn-danger">
Reset
</button>

</div>

</div>

<div class="row g-4 my-4">

<div class="col-md-4">

<div class="dashboard-stat purple">

<span>👥</span>

<small>Total DPT</small>

<strong id="adminDpt">0</strong>

</div>

</div>

<div class="col-md-4">

<div class="dashboard-stat green">

<span>🗳️</span>

<small>Suara Masuk</small>

<strong id="adminVotes">0</strong>

</div>

</div>

<div class="col-md-4">

<div class="dashboard-stat orange">

<span>📊</span>

<small>Partisipasi</small>

<strong id="adminParticipation">0%</strong>

</div>

</div>

</div>

<div class="dashboard-card">

<h3>📊 Perolehan Suara</h3>

<div id="adminResults"></div>

</div>

<div class="dashboard-card mt-4">

<div class="d-flex justify-content-between align-items-center">

<h3>📋 Log Pemilih</h3>

<span class="badge bg-primary" id="logCount">
0
</span>

</div>

<div class="table-responsive mt-3">

<table class="table align-middle">

<thead>

<tr>

<th>No</th>
<th>NISN / Token</th>
<th>Paslon</th>
<th>Waktu</th>

</tr>

</thead>

<tbody id="logs"></tbody>

</table>

</div>

</div>

</section>

</main>

<script src="script.js"></script>

</body>
</html>
